  <!-- Formulario para agregar terrenos -->
  <form id="form-terreno">
    <input type="text" id="titulo" placeholder="Título"><br>
    <input type="text" id="medidas" placeholder="Medidas"><br>
    <input type="text" id="area" placeholder="Área en m²"><br>
    <input type="text" id="mapa" placeholder="URL de mapa"><br>
    <input type="file" id="imagenes" multiple><br>
    <textarea id="descripcion" placeholder="Descripción"></textarea><br>
    <textarea id="documentos" placeholder="Documentos"></textarea><br>
    <textarea id="formasPago" placeholder="Formas de pago"></textarea><br>
    <textarea id="acceso" placeholder="Acceso"></textarea><br>
    <button type="submit">Guardar terreno</button>
  </form>

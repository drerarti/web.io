<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <h2>Panel de Administración</h2>
  <form id="form-terreno">
    <input type="text" id="titulo" placeholder="Título" required />
    <input type="text" id="medidas" placeholder="Medidas" required />
    <input type="text" id="area" placeholder="Área en m²" required />
    <input type="url" id="mapa" placeholder="Link Google Maps" required />
    <input type="file" id="imagenes" multiple />
    <textarea id="descripcion" placeholder="Descripción"></textarea>
    <textarea id="documentos" placeholder="Documentos requeridos"></textarea>
    <textarea id="formaPago" placeholder="Forma de pago"></textarea>
    <textarea id="extras" placeholder="Extras"></textarea>
    <button type="submit">Guardar terreno</button>
  </form>
  <div id="terrenos"></div>
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
